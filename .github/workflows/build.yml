name: Build Android APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -o "play-&-earn.zip" -d project
          BUILD_FILE=$(find project -maxdepth 3 -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace -Dcom.android.build.gradle.overrideVersionCheck=true -Dandroid.overrideVersionCheck=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
          
