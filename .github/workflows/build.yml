name: Build Android APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract and Build
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          mkdir -p project
          unzip -o "play-&-earn.zip" -d project
          
          GRADLEW_PATH=$(find project -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x gradlew
            ./gradlew assembleDebug --no-configuration-cache --stacktrace -Dandroid.overrideVersionCheck=true -Djava.awt.headless=true
          else
            BUILD_FILE=$(find project -name "build.gradle*" | head -n 1)
            cd "$(dirname "$BUILD_FILE")"
            gradle assembleDebug --no-configuration-cache --stacktrace -Dandroid.overrideVersionCheck=true -Djava.awt.headless=true
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
          
