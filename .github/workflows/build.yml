name: Build Android APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract and Build
        run: |
          mkdir -p project
          unzip -o "play-&-earn.zip" -d project
          
          ROOT_DIR=$(dirname $(find project -name "build.gradle*" | head -n 1))
          cd "$ROOT_DIR"
          
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties

          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace -Dandroid.overrideVersionCheck=true
          else
            gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace -Dandroid.overrideVersionCheck=true
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
          
