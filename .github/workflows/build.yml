name: Build Android APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          mkdir project
          unzip -o "play-&-earn.zip" -d project
          BUILD_FILE=$(find project -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            echo "PROJECT_ROOT=$(dirname "$BUILD_FILE")" >> $GITHUB_ENV
          else
            echo "PROJECT_ROOT=project" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd $PROJECT_ROOT
          gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
          
